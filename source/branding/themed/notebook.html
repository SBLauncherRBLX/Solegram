<!doctype html><html><body style="margin:0"><canvas id="c" width="432" height="432"></canvas><script>
const W = 432, K = 4; // 108 units -> 432 px
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// smooth 1D noise for wobbly pen lines
function noise1(seed) { const r = rng(seed), v = []; for (let i = 0; i < 64; i++) v.push(r() * 2 - 1);
  return t => { const i = Math.floor(t), f = t - i, a = v[((i % 64) + 64) % 64], b = v[(((i + 1) % 64) + 64) % 64]; const u = f * f * (3 - 2 * f); return a + (b - a) * u; }; }
const INK = 'rgb(28,52,160)';

// the shapes of the mark, in 432 px
function domePath(g) { g.beginPath(); g.arc(54 * K, 55.4 * K, 18.6 * K, Math.PI, 0); g.lineTo(72.6 * K, 56.6 * K); g.lineTo(35.4 * K, 56.6 * K); g.closePath(); }
function pill(g, x0, x1, yc, h) { const r = h / 2; g.beginPath(); g.moveTo(x0 + r, yc - r); g.lineTo(x1 - r, yc - r); g.arc(x1 - r, yc, r, -Math.PI / 2, Math.PI / 2); g.lineTo(x0 + r, yc + r); g.arc(x0 + r, yc, r, Math.PI / 2, Math.PI * 1.5); g.closePath(); }
const SHAPES = [
  g => domePath(g),
  g => pill(g, 38.3 * K, 69.7 * K, 61.44 * K, 4.65 * K),
  g => pill(g, 45.2 * K, 62.8 * K, 68.88 * K, 4.65 * K),
];
// outline points of a shape (sampled), for a wobbly retrace
function outline(shapeIdx, n) {
  const pts = [];
  if (shapeIdx === 0) {
    for (let i = 0; i <= n * 0.7; i++) { const a = Math.PI + Math.PI * i / (n * 0.7); pts.push([54 * K + Math.cos(a) * 18.6 * K, 55.4 * K + Math.sin(a) * 18.6 * K]); }
    pts.push([72.6 * K, 56.6 * K]); for (let i = 1; i <= n * 0.3; i++) pts.push([72.6 * K - 37.2 * K * i / (n * 0.3), 56.6 * K]);
  } else {
    const [x0, x1, yc] = shapeIdx === 1 ? [38.3, 69.7, 61.44] : [45.2, 62.8, 68.88], r = 2.325;
    const top = [], m = Math.round(n / 2);
    for (let i = 0; i <= m; i++) pts.push([(x0 + r + (x1 - x0 - 2 * r) * i / m) * K, (yc - r) * K]);
    for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + Math.PI * i / 10; pts.push([(x1 - r + Math.cos(a) * r) * K, (yc + Math.sin(a) * r) * K]); }
    for (let i = 0; i <= m; i++) pts.push([(x1 - r - (x1 - x0 - 2 * r) * i / m) * K, (yc + r) * K]);
    for (let i = 0; i <= 10; i++) { const a = Math.PI / 2 + Math.PI * i / 10; pts.push([(x0 + r + Math.cos(a) * r) * K, (yc + Math.sin(a) * r) * K]); }
  }
  return pts;
}
function wobbleStroke(g, pts, seed, amp, width, alpha, closed, overshoot) {
  const nx = noise1(seed), ny = noise1(seed + 7);
  g.save(); g.strokeStyle = INK; g.lineCap = 'round'; g.lineJoin = 'round'; g.globalAlpha = alpha; g.lineWidth = width;
  g.beginPath();
  const L = pts.length, extra = closed ? Math.round(L * overshoot) : 0;
  for (let i = 0; i < L + extra; i++) { const p = pts[i % L], t = i * 0.18; const x = p[0] + nx(t) * amp, y = p[1] + ny(t) * amp; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke(); g.restore();
}
// a pen scribble filling a shape: one zig-zag line, not lifting, ends a bit off the edge, some gaps
function scribble(g, shapeIdx, seed, spacing, angle, width, alpha, part) {
  const r = rng(seed); const c = document.createElement('canvas'); c.width = c.height = W; const t = c.getContext('2d');
  SHAPES[shapeIdx](t);
  const inside = (x, y) => t.isPointInPath(x, y);
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const segs = [];
  for (let d = -W; d < W; d += spacing * (0.55 + r() * 0.95)) {
    // points along the line x*sa - y*ca = d (direction (ca, sa)), find the run inside the shape
    let first = null, last = null;
    for (let s = -W; s < W * 1.5; s += 1.5) { const x = W / 2 + ca * s - sa * d, y = W / 2 + sa * s + ca * d; if (x < 0 || y < 0 || x > W || y > W) continue; if (inside(x, y)) { if (!first) first = [x, y]; last = [x, y]; } }
    if (!first) continue;
    if (part && (d < part[0] || d > part[1])) continue; // a second pass over only a part of it
    if (r() < 0.1) continue; // a missed strip
    const e0 = -5 + r() * 14, e1 = -5 + r() * 14; // overshoot (or short) at both ends
    segs.push([[first[0] - ca * e0, first[1] - sa * e0], [last[0] + ca * e1, last[1] + sa * e1]]);
  }
  const nx = noise1(seed + 3), ny = noise1(seed + 9);
  g.save(); g.strokeStyle = INK; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = width || 2.5; g.globalAlpha = alpha || 0.82;
  g.beginPath(); let k = 0, tt = 0;
  for (let i = 0; i < segs.length; i++) {
    const [a, b] = i % 2 ? [segs[i][1], segs[i][0]] : segs[i];
    const j = (p) => [p[0] + nx(tt += 0.9) * 3.2, p[1] + ny(tt) * 3.2];
    const A = j(a), B = j(b);
    if (!k++) g.moveTo(A[0], A[1]); else g.quadraticCurveTo(A[0] + (r() - 0.5) * 12, A[1] + (r() - 0.5) * 12, A[0], A[1]);
    // the stroke itself bends a little, as a hand does
    g.quadraticCurveTo((A[0] + B[0]) / 2 + (r() - 0.5) * 7, (A[1] + B[1]) / 2 + (r() - 0.5) * 7, B[0], B[1]);
  }
  g.stroke(); g.restore();
}
function background(g) {
  // squared school notebook paper
  g.fillStyle = '#fbf8f0'; g.fillRect(0, 0, W, W);
  const r = rng(11);
  // paper grain
  const img = g.getImageData(0, 0, W, W), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n - 1; }
  g.putImageData(img, 0, 0);
  const step = 27;
  g.strokeStyle = 'rgba(110,150,205,0.42)'; g.lineWidth = 1.4;
  for (let x = 6; x < W; x += step) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, W); g.stroke(); }
  for (let y = 9; y < W; y += step) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // the red margin line
  g.strokeStyle = 'rgba(220,70,80,0.75)'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(W - 98, 0); g.lineTo(W - 98, W); g.stroke();
  // a soft light from the top left
  const lg = g.createLinearGradient(0, 0, W, W); lg.addColorStop(0, 'rgba(255,255,255,0.25)'); lg.addColorStop(1, 'rgba(120,100,60,0.08)');
  g.fillStyle = lg; g.fillRect(0, 0, W, W);
}
function foreground(g) {
  g.clearRect(0, 0, W, W);
  g.translate(W / 2, W / 2); g.scale(1.12, 1.12); g.translate(-W / 2, -W / 2);
  // the fills first (a quick scribble), then the outlines over them
  scribble(g, 0, 21, 8.5, -0.62);
  scribble(g, 0, 57, 11, 0.35, 2.0, 0.6, [-40, 30]); // a few hasty strokes the other way
  scribble(g, 1, 33, 6.5, -0.9);
  scribble(g, 2, 45, 6.5, -0.9);
  for (let s = 0; s < 3; s++) {
    const pts = outline(s, 120);
    wobbleStroke(g, pts, 100 + s * 13, 2.2, 3.4, 0.95, true, 0.08);
    wobbleStroke(g, pts, 200 + s * 17, 3.4, 2.0, 0.55, true, 0.03); // the second, sloppier pass
  }
  // a few rays, drawn quickly
  const r = rng(77);
  for (let i = 0; i < 7; i++) {
    const a = Math.PI + Math.PI * (i + 0.5) / 7 + (r() - 0.5) * 0.08;
    const r0 = 22.5 * K + r() * 4, r1 = r0 + 4.5 * K + r() * 8;
    const cx = 54 * K, cy = 55.4 * K;
    wobbleStroke(g, [[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a) * (r0 + r1) / 2, cy + Math.sin(a) * (r0 + r1) / 2], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1]], 300 + i, 1.4, 3.2, 0.9, false, 0);
  }
}
window.render = (layer) => { const c = document.getElementById('c'), g = c.getContext('2d', {willReadFrequently: true}); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,W); (layer === 'bg' ? background : foreground)(g); return c.toDataURL('image/png'); };
</script></body></html>
